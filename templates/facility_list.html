{% extends "layout.html" %}{% block content %}<div class="facility-panel"><h1>{{category.icon}} {{category.fa}}</h1><form class="search-panel" method="get"><input name="q" value="{{search}}" placeholder="جستجوی نام، مدل، برند یا کاربرد..."><button>🔍 جستجو</button></form></div><div class="facility-list">{% for r in rows %}<div class="facility-card"><h2>{{r.name}}</h2><div class="facility-meta"><span>{{r.brand or 'بدون برند'}}</span><span>{{r.model or '-'}}</span></div><p>{{r.description}}</p><a href="/facility/{{r.id}}">مشاهده مشخصات ←</a></div>{% else %}<div class="facility-panel"><h2>🔎 موردی پیدا نشد</h2><p>برای عبارت جستجو داده‌ای وجود ندارد.</p></div>{% endfor %}</div>{% endblock %}
