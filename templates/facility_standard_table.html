{% extends "layout.html" %}{% block content %}<div class="facility-panel"><h1>📊 استاندارد: {{category}}</h1><form class="search-panel" method="get"><input name="q" value="{{search}}" placeholder="جستجو..."><button>🔍</button></form></div><div class="facility-panel" style="overflow-x:auto"><table class="facility-table"><thead><tr><th>کد</th><th>نام</th><th>استاندارد</th><th>سایز</th><th>توضیحات</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.code}}</td><td>{{r.name}}</td><td>{{r.standard}}</td><td>{{r.size}}</td><td>{{r.description}}</td></tr>{% else %}<tr><td colspan="5">موردی پیدا نشد.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
