{% extends "layout.html" %}
{% block content %}<div class="page-hero"><div><span class="eyebrow">STANDARDS</span><h1>📊 استانداردهای تأسیسات</h1><p>فهرست مراجع متداول برای طراحی و انتخاب تجهیزات. برای طراحی نهایی، آخرین ویرایش مرجع رسمی بررسی شود.</p></div></div><form class="search-panel facility-search"><input name="q" value="{{search}}" placeholder="کد یا نام استاندارد..."><button>جستجو</button></form><div class="table-wrap"><table class="standard-table"><thead><tr><th>کد</th><th>نام</th><th>حوزه</th><th>توضیح</th></tr></thead><tbody>{% for r in rows %}<tr><td><b>{{r.code}}</b></td><td>{{r.name}}</td><td>{{r.scope}}</td><td>{{r.description}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
